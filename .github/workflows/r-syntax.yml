name: R Markdown syntax

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Install knitr
        run: Rscript -e 'install.packages("knitr", repos="https://cloud.r-project.org")'
      - name: Extract and parse R code
        run: Rscript -e 'knitr::purl("melanoma_analysis.Rmd", output="ci-extracted.R", quiet=TRUE); parse(file="ci-extracted.R")'
